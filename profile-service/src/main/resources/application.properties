server.port=8081
spring.application.name=profile-service

# Mongo
spring.data.mongodb.uri=${MONGODB_URI_PROFILE}
spring.data.mongodb.auto-index-creation=true

# JWT secret used to validate tokens issued by identity-service
security.jwt.secret=${JWT_SECRET}

# Identity service base URL (for role upgrade call)
clients.identityBaseUrl=${IDENTITY_SERVICE_URL:http://localhost:8082}
clients.verificationBaseUrl=${VERIFICATION_SERVICE_URL:http://localhost:8083}
clients.adminBaseUrl=${ADMIN_SERVICE_URL:http://localhost:8087}
clients.listingBaseUrl=${LISTING_SERVICE_URL:http://localhost:8084}
clients.communityBaseUrl=${COMMUNITY_SERVICE_URL:http://localhost:8088}

# Same internal secret for calling identity-service internal endpoint
internal.sharedSecret=${INTERNAL_SHARED_SECRET}
clients.notificationsBaseUrl=${NOTIFICATIONS_SERVICE_URL:http://localhost:8085}

# Fail closed: deployment must provide independent authentication secrets.
security.identity-url=${IDENTITY_SERVICE_URL:http://localhost:8082}
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.http-only=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=25MB
