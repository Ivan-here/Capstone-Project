server.port=9000
spring.main.web-application-type=reactive

# -----------------------
# CORS
# -----------------------
spring.cloud.gateway.globalcors.add-to-simple-url-handler-mapping=true
spring.cloud.gateway.default-filters[0]=DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials, RETAIN_FIRST
spring.cloud.gateway.globalcors.corsConfigurations.[/**].allowedOriginPatterns=${CORS_ALLOWED_ORIGIN_PATTERNS:http://localhost:5173,http://localhost:5174}
spring.cloud.gateway.globalcors.corsConfigurations.[/**].allowedMethods=GET,POST,PUT,PATCH,DELETE,OPTIONS
spring.cloud.gateway.globalcors.corsConfigurations.[/**].allowedHeaders=*
spring.cloud.gateway.globalcors.corsConfigurations.[/**].exposedHeaders=*
spring.cloud.gateway.globalcors.corsConfigurations.[/**].allowCredentials=true

# =========================
# IDENTITY-SERVICE (8082)
# =========================
spring.cloud.gateway.routes[0].id=auth
spring.cloud.gateway.routes[0].uri=http://identity-service:8082
spring.cloud.gateway.routes[0].predicates[0]=Path=/auth/**

# =========================
# PROFILE-SERVICE (8081) - PUBLIC
# =========================
spring.cloud.gateway.routes[1].id=profiles
spring.cloud.gateway.routes[1].uri=http://profile-service:8081
spring.cloud.gateway.routes[1].predicates[0]=Path=/profiles/**

# =========================
# PROFILE-SERVICE (8081) - INTERNAL (DEV ONLY)
# =========================
spring.cloud.gateway.routes[2].id=profiles-internal
spring.cloud.gateway.routes[2].uri=http://profile-service:8081
spring.cloud.gateway.routes[2].predicates[0]=Path=/internal/profiles/**

# =========================
# LISTING-SERVICE (8084)
# =========================
spring.cloud.gateway.routes[3].id=listings
spring.cloud.gateway.routes[3].uri=http://listing-service:8084
spring.cloud.gateway.routes[3].predicates[0]=Path=/api/listings/**

# =========================
# ORDER-RESERVATION-SERVICE (8086)
# =========================
spring.cloud.gateway.routes[4].id=orders-and-reservations
spring.cloud.gateway.routes[4].uri=http://order-reservation-service:8086
spring.cloud.gateway.routes[4].predicates[0]=Path=/api/orders/**,/api/reservations/**

# =========================
# VERIFICATION-SERVICE (8083)
# =========================
spring.cloud.gateway.routes[5].id=verification
spring.cloud.gateway.routes[5].uri=http://verification-service:8083
spring.cloud.gateway.routes[5].predicates[0]=Path=/api/verification/**

# =========================
# NOTIFICATIONS-SERVICE (8085)
# =========================
spring.cloud.gateway.routes[6].id=notifications
spring.cloud.gateway.routes[6].uri=http://notifications-service:8085
spring.cloud.gateway.routes[6].predicates[0]=Path=/notifications/**

spring.cloud.gateway.routes[7].id=notifications-ping
spring.cloud.gateway.routes[7].uri=http://notifications-service:8085
spring.cloud.gateway.routes[7].predicates[0]=Path=/ping

# =========================
# ADMIN-SERVICE (8087)
# =========================
spring.cloud.gateway.routes[8].id=admin
spring.cloud.gateway.routes[8].uri=http://admin-service:8087
spring.cloud.gateway.routes[8].predicates[0]=Path=/admin/**,/support/**

management.endpoints.web.exposure.include=health,info


spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=100MB
spring.codec.max-in-memory-size=100MB
spring.webflux.multipart.max-in-memory-size=10MB
spring.webflux.multipart.max-disk-usage-per-part=100MB

# =========================
# COMMUNITY-SERVICE (8088)
# =========================
spring.cloud.gateway.routes[9].id=community
spring.cloud.gateway.routes[9].uri=http://community-service:8088
spring.cloud.gateway.routes[9].predicates[0]=Path=/api/community/**

# =========================
# REVIEW-SERVICE (8089)
# =========================
