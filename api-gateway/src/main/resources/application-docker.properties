# ===============================
# SERVER
# ===============================
server.port=9000
spring.main.web-application-type=reactive

# ===============================
# IDENTITY SERVICE (8082)
# ===============================
spring.cloud.gateway.routes[0].id=identity-auth
spring.cloud.gateway.routes[0].uri=http://identity-service:8082
spring.cloud.gateway.routes[0].predicates[0]=Path=/auth/**

# ===============================
# PROFILE SERVICE (8081)
# ===============================
spring.cloud.gateway.routes[1].id=profile
spring.cloud.gateway.routes[1].uri=http://profile-service:8081
spring.cloud.gateway.routes[1].predicates[0]=Path=/profiles/**

# ===============================
# LISTING SERVICE (8084)
# ===============================
spring.cloud.gateway.routes[2].id=listing
spring.cloud.gateway.routes[2].uri=http://listing-service:8084
spring.cloud.gateway.routes[2].predicates[0]=Path=/api/listings/**

# ===============================
# ORDER + RESERVATION SERVICE (8086)
# ===============================
spring.cloud.gateway.routes[3].id=orders
spring.cloud.gateway.routes[3].uri=http://order-reservation-service:8086
spring.cloud.gateway.routes[3].predicates[0]=Path=/api/orders/**,/api/reservations/**

# ===============================
# VERIFICATION SERVICE (8083)
# ===============================
spring.cloud.gateway.routes[4].id=verification
spring.cloud.gateway.routes[4].uri=http://verification-service:8083
spring.cloud.gateway.routes[4].predicates[0]=Path=/api/verification/**

# ===============================
# NOTIFICATIONS SERVICE (8085)
# ===============================
spring.cloud.gateway.routes[5].id=notifications
spring.cloud.gateway.routes[5].uri=http://notifications-service:8085
spring.cloud.gateway.routes[5].predicates[0]=Path=/notifications/**

spring.cloud.gateway.routes[6].id=notifications-ping
spring.cloud.gateway.routes[6].uri=http://notifications-service:8085
spring.cloud.gateway.routes[6].predicates[0]=Path=/ping

# ===============================
# ACTUATOR (optional)
# ===============================
management.endpoints.web.exposure.include=health,info