server.port=9000
spring.main.web-application-type=reactive

# =========================
# IDENTITY-SERVICE (8082)
# =========================
spring.cloud.gateway.routes[0].id=auth
spring.cloud.gateway.routes[0].uri=http://identity-service:8082
spring.cloud.gateway.routes[0].predicates[0]=Path=/auth/**

spring.cloud.gateway.routes[3].id=profiles-internal
spring.cloud.gateway.routes[3].uri=http://profile-service:8081
spring.cloud.gateway.routes[3].predicates[0]=Path=/internal/profiles/**

# =========================
# LISTING-SERVICE (8084)
# =========================
spring.cloud.gateway.routes[4].id=listings
spring.cloud.gateway.routes[4].uri=http://listing-service:8084
spring.cloud.gateway.routes[4].predicates[0]=Path=/api/listings/**

# =========================
# ORDER-RESERVATION-SERVICE (8086)
# Your controller base is /api, so we route /api/orders/** and /api/reservations/**
# =========================
spring.cloud.gateway.routes[5].id=orders-and-reservations
spring.cloud.gateway.routes[5].uri=http://order-reservation-service:8086
spring.cloud.gateway.routes[5].predicates[0]=Path=/api/orders/**,/api/reservations/**

# =========================
# VERIFICATION-SERVICE (8083)
# =========================
spring.cloud.gateway.routes[6].id=verification
spring.cloud.gateway.routes[6].uri=http://verification-service:8083
spring.cloud.gateway.routes[6].predicates[0]=Path=/api/verification/**

# =========================
# NOTIFICATIONS-SERVICE (8085)
# =========================
spring.cloud.gateway.routes[7].id=notifications
spring.cloud.gateway.routes[7].uri=http://notifications-service:8085
spring.cloud.gateway.routes[7].predicates[0]=Path=/notifications/**

spring.cloud.gateway.routes[8].id=notifications-ping
spring.cloud.gateway.routes[8].uri=http://notifications-service:8085
spring.cloud.gateway.routes[8].predicates[0]=Path=/ping



# Optional actuator
management.endpoints.web.exposure.include=health,info

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# =========================
# COMMUNITY-SERVICE (8088)
# =========================
spring.cloud.gateway.routes[9].id=community
spring.cloud.gateway.routes[9].uri=http://community-service:8088
spring.cloud.gateway.routes[9].predicates[0]=Path=/api/community/**
