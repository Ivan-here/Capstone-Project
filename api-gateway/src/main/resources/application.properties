server.port=9000
spring.main.web-application-type=reactive

# -----------------------
# CORS
# -----------------------
spring.cloud.gateway.server.webflux.globalcors.add-to-simple-url-handler-mapping=true
spring.cloud.gateway.server.webflux.default-filters[0]=DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials, RETAIN_FIRST
spring.cloud.gateway.server.webflux.globalcors.corsConfigurations.[/**].allowedOriginPatterns=${CORS_ALLOWED_ORIGIN_PATTERNS:https://www.locallyl.com,https://locallyl.com}
spring.cloud.gateway.server.webflux.globalcors.corsConfigurations.[/**].allowedMethods=GET,POST,PUT,PATCH,DELETE,OPTIONS
spring.cloud.gateway.server.webflux.globalcors.corsConfigurations.[/**].allowedHeaders=Authorization,Content-Type,userId
spring.cloud.gateway.server.webflux.globalcors.corsConfigurations.[/**].exposedHeaders=Retry-After
spring.cloud.gateway.server.webflux.globalcors.corsConfigurations.[/**].allowCredentials=false

# =========================
# IDENTITY-SERVICE (8082)
# =========================
spring.cloud.gateway.server.webflux.routes[0].id=auth
spring.cloud.gateway.server.webflux.routes[0].uri=http://localhost:8082
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/auth/**

# =========================
# PROFILE-SERVICE (8081) - PUBLIC
# =========================
spring.cloud.gateway.server.webflux.routes[1].id=profiles
spring.cloud.gateway.server.webflux.routes[1].uri=http://localhost:8081
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/profiles/**

# =========================
# PROFILE-SERVICE (8081) - INTERNAL (DEV ONLY)
# =========================

# =========================
# LISTING-SERVICE (8084)
# =========================
spring.cloud.gateway.server.webflux.routes[2].id=listings
spring.cloud.gateway.server.webflux.routes[2].uri=http://localhost:8084
spring.cloud.gateway.server.webflux.routes[2].predicates[0]=Path=/api/listings/**

# =========================
# ORDER-RESERVATION-SERVICE (8086)
# Your controller base is /api, so we route /api/orders/** and /api/reservations/**
# =========================
spring.cloud.gateway.server.webflux.routes[3].id=orders-and-reservations
spring.cloud.gateway.server.webflux.routes[3].uri=http://localhost:8086
spring.cloud.gateway.server.webflux.routes[3].predicates[0]=Path=/api/orders/**,/api/reservations/**

# =========================
# VERIFICATION-SERVICE (8083)
# =========================
spring.cloud.gateway.server.webflux.routes[4].id=verification
spring.cloud.gateway.server.webflux.routes[4].uri=http://localhost:8083
spring.cloud.gateway.server.webflux.routes[4].predicates[0]=Path=/api/verification/**

# =========================
# NOTIFICATIONS-SERVICE (8085)
# =========================
spring.cloud.gateway.server.webflux.routes[5].id=notifications
spring.cloud.gateway.server.webflux.routes[5].uri=http://localhost:8085
spring.cloud.gateway.server.webflux.routes[5].predicates[0]=Path=/notifications/**

spring.cloud.gateway.server.webflux.routes[6].id=notifications-ping
spring.cloud.gateway.server.webflux.routes[6].uri=http://localhost:8085
spring.cloud.gateway.server.webflux.routes[6].predicates[0]=Path=/ping

# =========================
# ADMIN-SERVICE (8087)
# =========================
spring.cloud.gateway.server.webflux.routes[7].id=admin
spring.cloud.gateway.server.webflux.routes[7].uri=http://localhost:8087
spring.cloud.gateway.server.webflux.routes[7].predicates[0]=Path=/admin/**,/support/**

# Optional actuator
management.endpoints.web.exposure.include=health,info

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=25MB
spring.codec.max-in-memory-size=1MB
spring.webflux.multipart.max-in-memory-size=10MB
spring.webflux.multipart.max-disk-usage-per-part=100MB

# =========================
# COMMUNITY-SERVICE (8088)
# =========================
spring.cloud.gateway.server.webflux.routes[8].id=community
spring.cloud.gateway.server.webflux.routes[8].uri=http://localhost:8088
spring.cloud.gateway.server.webflux.routes[8].predicates[0]=Path=/api/community/**

spring.cloud.gateway.server.webflux.routes[9].id=reviews
spring.cloud.gateway.server.webflux.routes[9].uri=http://localhost:8089
spring.cloud.gateway.server.webflux.routes[9].predicates[0]=Path=/api/reviews/**


# =========================
# FOLLOW-SERVICE (8091)
# =========================
spring.cloud.gateway.server.webflux.routes[11].id=follow-service
spring.cloud.gateway.server.webflux.routes[11].uri=http://localhost:8091
spring.cloud.gateway.server.webflux.routes[11].predicates[0]=Path=/api/follows/**

# =========================
# STRIPE PAYMENT-SERVICE (8090)
# =========================
spring.cloud.gateway.server.webflux.routes[10].id=stripe-payment
spring.cloud.gateway.server.webflux.routes[10].uri=http://localhost:8090
spring.cloud.gateway.server.webflux.routes[10].predicates[0]=Path=/api/payments/**,/api/sellers/**,/api/stripe/**


# =========================
# STRIPE PAYMENT-SERVICE (8090)
# =========================

server.error.include-message=never
server.error.include-stacktrace=never
