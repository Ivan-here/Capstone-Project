spring.application.name=order_reservation-service
server.port=8086

#format: mongodb://host:port/database_name
spring.data.mongodb.uri=${MONGODB_URI_ORDER}

stripe.secret-key=${STRIPE_SECRET_KEY}
stripe.publishable-key=${STRIPE_PUBLISHABLE_KEY}
stripe.webhook-secret=${STRIPE_WEBHOOK_SECRET}

stripe.return-url=${STRIPE_RETURN_URL}
stripe.refresh-url=${STRIPE_REFRESH_URL}
platform.fee-percent=${PLATFORM_FEE_PERCENT:8.0}
payment.service.base-url=${PAYMENT_SERVICE_BASE_URL:http://localhost:8090}

listing.service.base-url=${LISTING_SERVICE_BASE_URL:http://localhost:8084}


logging.level.com.locally=DEBUG

notifications.service.base-url=${NOTIFICATIONS_SERVICE_BASE_URL:http://localhost:8085}

# Fail closed: deployment must provide independent authentication secrets.
security.identity-url=${IDENTITY_SERVICE_URL:http://localhost:8082}
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.http-only=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=25MB
