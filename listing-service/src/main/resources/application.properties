spring.application.name=ListingService

server.port=8084

spring.data.mongodb.host=localhost
spring.data.mongodb.port=27017
spring.data.mongodb.database=listingdb
application.config.profile-url=${PROFILE_SERVICE_BASE_URL:http://localhost:8081}
application.config.payment-url=${PAYMENT_SERVICE_BASE_URL:http://localhost:8090}

# Logging
logging.level.org.springframework.data.mongodb=INFO
logging.level.ca.gbc.comp3095.verificationservice=DEBUG



# Cloudinary Configuration
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME}
cloudinary.api-key=${CLOUDINARY_API_KEY}
cloudinary.api-secret=${CLOUDINARY_API_SECRET}


application.config.notifications-url=${NOTIFICATIONS_SERVICE_BASE_URL:http://localhost:8085}
application.config.follow-url=${FOLLOW_SERVICE_BASE_URL:http://localhost:8091}

# Fail closed: deployment must provide independent authentication secrets.
security.identity-url=${IDENTITY_SERVICE_URL:http://localhost:8082}
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.http-only=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=25MB
