spring.application.name=stripe_payment-service
server.port=8090

stripe.secret-key=${STRIPE_SECRET_KEY}
stripe.publishable-key=${STRIPE_PUBLISHABLE_KEY}
stripe.webhook-secret=${STRIPE_WEBHOOK_SECRET}

stripe.return-url=${STRIPE_RETURN_URL}
stripe.refresh-url=${STRIPE_REFRESH_URL}
app.frontend-profile-url=${FRONTEND_PROFILE_URL}
app.public-platform-base-url=${PUBLIC_PLATFORM_BASE_URL}

spring.data.mongodb.uri=${MONGODB_URI_PAYMENT}

clients.profileBaseUrl=${PROFILE_SERVICE_BASE_URL}
clients.orderBaseUrl=${ORDER_SERVICE_BASE_URL}

# Fail closed: deployment must provide independent authentication secrets.
security.identity-url=${IDENTITY_SERVICE_URL:http://localhost:8082}
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.http-only=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=25MB
