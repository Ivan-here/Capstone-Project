name: Backend Deploy

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: Backend-env

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup SSH to EC2
        shell: bash
        run: |
          echo "Using shell: $SHELL"
          echo "Home: $HOME"
          mkdir -p "$HOME/.ssh"
          printf '%s' "${{ secrets.EC2_SSH_KEY }}" > "$HOME/.ssh/id_rsa"
          chmod 600 "$HOME/.ssh/id_rsa"
          ssh-keyscan -H "${{ secrets.EC2_HOST }}" >> "$HOME/.ssh/known_hosts"

      - name: Deploy backend
        shell: bash
        run: |
          ssh "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}" '
            cd "${{ secrets.EC2_APP_DIR }}" &&
            git checkout main &&
            git pull origin main &&
            docker compose up -d --build &&
            docker compose ps
          '
