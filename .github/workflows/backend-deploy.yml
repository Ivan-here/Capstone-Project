name: Backend Deploy

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: [self-hosted, Linux, X64]
    environment: Backend-env

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy backend
        shell: bash
        env:
          COMPOSE_PARALLEL_LIMIT: 4
        run: |
          cd "${{ secrets.EC2_APP_DIR }}"
          git checkout main
          git pull origin main
          docker compose up -d --build
          docker compose ps
