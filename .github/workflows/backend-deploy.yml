name: Backend Deploy

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: [self-hosted, linux, arm64, aws, backend]
    environment: Backend-env

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy backend
        shell: bash
        env:
          COMPOSE_PARALLEL_LIMIT: 2
        run: |
          cd "${{ secrets.EC2_APP_DIR }}"
          git checkout main
          git pull origin main
          docker-compose -f docker-compose.yml -f deploy/docker-compose.runtime.yml up -d --no-build
          docker-compose -f docker-compose.yml -f deploy/docker-compose.runtime.yml ps
