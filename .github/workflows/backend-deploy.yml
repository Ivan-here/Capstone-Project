name: Backend Deploy

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: [self-hosted, linux, arm64, aws, backend]
    environment: Backend-env

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy backend
        shell: bash
        env:
          COMPOSE_PARALLEL_LIMIT: 2
          EC2_APP_DIR: ${{ secrets.EC2_APP_DIR }}
        run: |
          mkdir -p "$EC2_APP_DIR/deploy"
          cp deploy/Dockerfile.runtime "$EC2_APP_DIR/deploy/Dockerfile.runtime"
          cp deploy/docker-compose.runtime.yml "$EC2_APP_DIR/deploy/docker-compose.runtime.yml"
          cd "$EC2_APP_DIR"
          docker-compose -f docker-compose.yml -f deploy/docker-compose.runtime.yml up -d --no-build
          docker-compose -f docker-compose.yml -f deploy/docker-compose.runtime.yml ps
