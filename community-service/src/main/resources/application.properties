server.port=8088
spring.application.name=community-service
spring.data.mongodb.uri=${SPRING_DATA_MONGODB_URI}
services.identity.base-url=http://localhost:8082
services.notifications.base-url=http://localhost:8085
internal.sharedSecret=${INTERNAL_SHARED_SECRET}

# Fail closed: deployment must provide independent authentication secrets.
security.identity-url=${IDENTITY_SERVICE_URL:http://localhost:8082}
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.http-only=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=25MB
