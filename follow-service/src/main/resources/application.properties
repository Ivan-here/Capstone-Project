spring.application.name=follow-service

server.port=8091

spring.data.mongodb.uri=${SPRING_DATA_MONGODB_URI}

clients.profile-service.url=http://localhost:8081

# Logging
logging.level.org.springframework.data.mongodb=INFO
logging.level.com.example.followservice=DEBUG
clients.notifications-service.url=${NOTIFICATIONS_SERVICE_URL:http://localhost:8085}

# Fail closed: deployment must provide independent authentication secrets.
security.identity-url=${IDENTITY_SERVICE_URL:http://localhost:8082}
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.http-only=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=25MB
