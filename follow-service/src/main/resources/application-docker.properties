spring.application.name=follow-service

server.port=8091

# MongoDB Connection (Injected via Docker Compose)
spring.data.mongodb.uri=${SPRING_DATA_MONGODB_URI}

# Feign Client URL for Profile Service (Injected via Docker Compose, falls back to localhost)
clients.profile-service.url=${PROFILE_SERVICE_URL:http://profile-service:8081}

# Logging
logging.level.org.springframework.data.mongodb=INFO
# FIXED: Changed from reviewservice to followservice
logging.level.com.example.followservice=DEBUG