server.port=8082
spring.application.name=identity-service

# Mongo (local default; override in prod with env var MONGODB_URI)
spring.data.mongodb.uri=${MONGODB_URI_IDENTITY}
spring.data.mongodb.auto-index-creation=true

# JWT config
security.jwt.secret=${JWT_SECRET}
security.jwt.accessTokenSeconds=3600

# Internal service-to-service secret
internal.sharedSecret=${INTERNAL_SHARED_SECRET}

# Fail closed: deployment must provide independent authentication secrets.
security.identity-url=${IDENTITY_SERVICE_URL:http://localhost:8082}
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.http-only=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=25MB

spring.data.mongodb.auto-index-creation=true
