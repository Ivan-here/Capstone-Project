services:
  # 1. The Database (FIXED CREDENTIALS)
  #  mongodb:
  #    image: mongo:latest
  #    container_name: mongodb
  #    ports:
  #      - "27017:27017"
  #    environment:

  #      # These MUST match your application.properties
  #      MONGO_INITDB_ROOT_USERNAME: myuser
  #      MONGO_INITDB_ROOT_PASSWORD: rootpass
  #    volumes:
  #      - mongo_data:/data/db

  # 2. Service A: Verification
  verification-service:
    build: ./verification-service
    container_name: verification_service
    ports:
      - "8083:8083"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_CLOUD_COMPATIBILITY_VERIFIER_ENABLED: "false"
      INTERNAL_SHARED_SECRET: "${INTERNAL_SHARED_SECRET}"
      SPRING_DATA_MONGODB_URI: "${MONGODB_URI_VERIFICATION}"
      CLOUDINARY_CLOUD_NAME: "${CLOUDINARY_CLOUD_NAME}"
      CLOUDINARY_API_KEY: "${CLOUDINARY_API_KEY}"
      CLOUDINARY_API_SECRET: "${CLOUDINARY_API_SECRET}"

  listing-service:
    build: ./listing-service
    container_name: listing_service
    ports:
      - "8084:8084"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_CLOUD_COMPATIBILITY_VERIFIER_ENABLED: "false"
      SPRING_DATA_MONGODB_URI: "${MONGODB_URI_LISTING}"
      PAYMENT_SERVICE_BASE_URL: "http://stripe-payment-service:8090"
      NOTIFICATIONS_SERVICE_BASE_URL: "http://notifications-service:8085"
      FOLLOW_SERVICE_BASE_URL: "http://follow-service:8091"
      CLOUDINARY_CLOUD_NAME: "${CLOUDINARY_CLOUD_NAME}"
      CLOUDINARY_API_KEY: "${CLOUDINARY_API_KEY}"
      CLOUDINARY_API_SECRET: "${CLOUDINARY_API_SECRET}"

  identity-service:
    build:
      context: ./identity-service
    container_name: identity_service
    ports:
      - "8082:8082"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATA_MONGODB_URI: "${MONGODB_URI_IDENTITY}"
      SECURITY_JWT_SECRET: "${JWT_SECRET}"
      INTERNAL_SHARED_SECRET: "${INTERNAL_SHARED_SECRET}"

  profile-service:
    build:
      context: ./profile-service
    container_name: profile_service
    ports:
      - "8081:8081"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATA_MONGODB_URI: "${MONGODB_URI_PROFILE}"
      JWT_SECRET: "${JWT_SECRET}"
      INTERNAL_SHARED_SECRET: "${INTERNAL_SHARED_SECRET}"
      CLIENTS_IDENTITYBASEURL: "http://identity-service:8082"
      CLIENTS_VERIFICATIONBASEURL: "http://verification-service:8083"
      CLIENTS_ADMINBASEURL: "http://admin-service:8087"
    depends_on:
      - identity-service

  order-reservation-service:
    build: ./order_reservation-service
    container_name: order_reservation_service
    ports:
      - "8086:8086"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATA_MONGODB_URI: "${MONGODB_URI_ORDER}"
      LISTING_SERVICE_BASE_URL: "http://listing-service:8084"
      PAYMENT_SERVICE_BASE_URL: "http://stripe-payment-service:8090"
      NOTIFICATIONS_SERVICE_BASE_URL: "http://notifications-service:8085"

  notifications-service:
    build: ./notifications-service
    container_name: notifications_service
    ports:
      - "8085:8085"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_CLOUD_COMPATIBILITY_VERIFIER_ENABLED: "false"
      SPRING_DATA_MONGODB_URI: "${MONGODB_URI_NOTIFICATIONS}"
      SERVICES_IDENTITY_BASE_URL: "http://identity-service:8082"
      INTERNAL_SHARED_SECRET: "${INTERNAL_SHARED_SECRET}"

  community-service:
    build: ./community-service
    container_name: community_service
    ports:
      - "8088:8088"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_CLOUD_COMPATIBILITY_VERIFIER_ENABLED: "false"
      SPRING_DATA_MONGODB_URI: "${MONGODB_URI_COMMUNITY}"
      SERVICES_IDENTITY_BASE_URL: "http://identity-service:8082"
      SERVICES_NOTIFICATIONS_BASE_URL: "http://notifications-service:8085"
      INTERNAL_SHARED_SECRET: "${INTERNAL_SHARED_SECRET}"

  review-service:
    build: ./review-service
    container_name: review_service
    ports:
      - "8089:8089"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATA_MONGODB_URI: "${MONGODB_URI_REVIEW}"
      CLIENTS_ORDERRESERVATIONBASEURL: "http://order-reservation-service:8086"
      INTERNAL_SHARED_SECRET: "${INTERNAL_SHARED_SECRET}"

  # --- NEW FOLLOW SERVICE ---
  follow-service:
    build: ./follow-service
    container_name: follow-service
    ports:
      - "8091:8091"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATA_MONGODB_URI: "${MONGODB_URI_FOLLOW}"
      CLIENTS_PROFILE_SERVICE_URL: "http://profile-service:8081"
      NOTIFICATIONS_SERVICE_URL: "http://notifications-service:8085"
    depends_on:
      - profile-service

  api-gateway:
    build:
      context: ./api-gateway
    ports:
      - "9000:9000"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      CORS_ALLOWED_ORIGIN_PATTERNS: "${CORS_ALLOWED_ORIGIN_PATTERNS:-https://www.locallyl.com,https://locallyl.com,http://localhost:*,http://127.0.0.1:*}"
    depends_on:
      - identity-service
      - profile-service
      - listing-service
      - verification-service
      - order-reservation-service
      - notifications-service
      - community-service
      - review-service
      - follow-service
      - stripe-payment-service

  admin-service:
    build:
      context: ./admin-service
    container_name: admin_service
    ports:
      - "8087:8087"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATA_MONGODB_URI: "${MONGODB_URI_ADMIN}"
      SECURITY_JWT_SECRET: "${JWT_SECRET}"
      CLIENTS_IDENTITYBASEURL: "http://identity-service:8082"
      CLIENTS_PROFILEBASEURL: "http://profile-service:8081"
      CLIENTS_LISTINGBASEURL: "http://listing-service:8084"
      CLIENTS_NOTIFICATIONSBASEURL: "http://notifications-service:8085"
      CLIENTS_ORDERRESERVATIONBASEURL: "http://order-reservation-service:8086"
      CLIENTS_VERIFICATIONBASEURL: "http://verification-service:8083"
    depends_on:
      - identity-service
      - profile-service
      - listing-service
      - notifications-service
      - order-reservation-service
      - verification-service
      - review-service
      - community-service

  stripe-payment-service:
    build: ./stripe-payment-service
    container_name: stripe_payment_service
    ports:
      - "8090:8090"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      STRIPE_SECRET_KEY: "${STRIPE_SECRET_KEY}"
      STRIPE_PUBLISHABLE_KEY: "${STRIPE_PUBLISHABLE_KEY}"
      STRIPE_WEBHOOK_SECRET: "${STRIPE_WEBHOOK_SECRET}"
      STRIPE_RETURN_URL: "${STRIPE_RETURN_URL}"
      STRIPE_REFRESH_URL: "${STRIPE_REFRESH_URL}"
      FRONTEND_PROFILE_URL: "${FRONTEND_PROFILE_URL}"
      PUBLIC_PLATFORM_BASE_URL: "${PUBLIC_PLATFORM_BASE_URL}"
      PROFILE_SERVICE_BASE_URL: "http://profile-service:8081"
      ORDER_SERVICE_BASE_URL: "http://order-reservation-service:8086"
      CLIENTS_PROFILEBASEURL: "http://profile-service:8081"
      CLIENTS_ORDERBASEURL: "http://order-reservation-service:8086"
      SPRING_DATA_MONGODB_URI: "${MONGODB_URI_PAYMENT}"
    depends_on:
      - profile-service
      - order-reservation-service

volumes:
  mongo_data:
