x-security: &service-security
  read_only: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  tmpfs:
    - /tmp:size=64m,mode=1777

services:
  # 2. Service A: Verification
  verification-service:
    <<: *service-security
    build:
      context: .
      dockerfile: verification-service/Dockerfile
    container_name: verification_service
    expose:
      - "8083"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      JWT_SECRET: "${JWT_SECRET:?Set JWT_SECRET}"
      INTERNAL_SHARED_SECRET: "${INTERNAL_SHARED_SECRET:?Set INTERNAL_SHARED_SECRET}"
      SPRING_DATA_MONGODB_URI: "${MONGODB_URI_VERIFICATION}"
      CLOUDINARY_CLOUD_NAME: "${CLOUDINARY_CLOUD_NAME}"
      CLOUDINARY_API_KEY: "${CLOUDINARY_API_KEY}"
      CLOUDINARY_API_SECRET: "${CLOUDINARY_API_SECRET}"

  listing-service:
    <<: *service-security
    build:
      context: .
      dockerfile: listing-service/Dockerfile
    container_name: listing_service
    expose:
      - "8084"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      JWT_SECRET: "${JWT_SECRET:?Set JWT_SECRET}"
      INTERNAL_SHARED_SECRET: "${INTERNAL_SHARED_SECRET:?Set INTERNAL_SHARED_SECRET}"
      SPRING_DATA_MONGODB_URI: "${MONGODB_URI_LISTING}"
      PAYMENT_SERVICE_BASE_URL: "http://stripe-payment-service:8090"
      NOTIFICATIONS_SERVICE_BASE_URL: "http://notifications-service:8085"
      FOLLOW_SERVICE_BASE_URL: "http://follow-service:8091"
      CLOUDINARY_CLOUD_NAME: "${CLOUDINARY_CLOUD_NAME}"
      CLOUDINARY_API_KEY: "${CLOUDINARY_API_KEY}"
      CLOUDINARY_API_SECRET: "${CLOUDINARY_API_SECRET}"

  identity-service:
    <<: *service-security
    build:
      context: .
      dockerfile: identity-service/Dockerfile
    container_name: identity_service
    expose:
      - "8082"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      JWT_SECRET: "${JWT_SECRET:?Set JWT_SECRET}"
      INTERNAL_SHARED_SECRET: "${INTERNAL_SHARED_SECRET:?Set INTERNAL_SHARED_SECRET}"
      SPRING_DATA_MONGODB_URI: "${MONGODB_URI_IDENTITY}"
      SECURITY_JWT_SECRET: "${JWT_SECRET}"

  profile-service:
    <<: *service-security
    build:
      context: .
      dockerfile: profile-service/Dockerfile
    container_name: profile_service
    expose:
      - "8081"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      JWT_SECRET: "${JWT_SECRET:?Set JWT_SECRET}"
      INTERNAL_SHARED_SECRET: "${INTERNAL_SHARED_SECRET:?Set INTERNAL_SHARED_SECRET}"
      SPRING_DATA_MONGODB_URI: "${MONGODB_URI_PROFILE}"
      CLOUDINARY_CLOUD_NAME: "${CLOUDINARY_CLOUD_NAME}"
      CLOUDINARY_API_KEY: "${CLOUDINARY_API_KEY}"
      CLOUDINARY_API_SECRET: "${CLOUDINARY_API_SECRET}"
      CLIENTS_IDENTITYBASEURL: "http://identity-service:8082"
      CLIENTS_VERIFICATIONBASEURL: "http://verification-service:8083"
      CLIENTS_ADMINBASEURL: "http://admin-service:8087"
    depends_on:
      - identity-service

  order-reservation-service:
    <<: *service-security
    build:
      context: .
      dockerfile: order_reservation-service/Dockerfile
    container_name: order_reservation_service
    expose:
      - "8086"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      JWT_SECRET: "${JWT_SECRET:?Set JWT_SECRET}"
      INTERNAL_SHARED_SECRET: "${INTERNAL_SHARED_SECRET:?Set INTERNAL_SHARED_SECRET}"
      SPRING_DATA_MONGODB_URI: "${MONGODB_URI_ORDER}"
      LISTING_SERVICE_BASE_URL: "http://listing-service:8084"
      PAYMENT_SERVICE_BASE_URL: "http://stripe-payment-service:8090"
      NOTIFICATIONS_SERVICE_BASE_URL: "http://notifications-service:8085"

  notifications-service:
    <<: *service-security
    build:
      context: .
      dockerfile: notifications-service/Dockerfile
    container_name: notifications_service
    expose:
      - "8085"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      JWT_SECRET: "${JWT_SECRET:?Set JWT_SECRET}"
      INTERNAL_SHARED_SECRET: "${INTERNAL_SHARED_SECRET:?Set INTERNAL_SHARED_SECRET}"
      SPRING_DATA_MONGODB_URI: "${MONGODB_URI_NOTIFICATIONS}"
      SERVICES_IDENTITY_BASE_URL: "http://identity-service:8082"

  community-service:
    <<: *service-security
    build:
      context: .
      dockerfile: community-service/Dockerfile
    container_name: community_service
    expose:
      - "8088"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      JWT_SECRET: "${JWT_SECRET:?Set JWT_SECRET}"
      INTERNAL_SHARED_SECRET: "${INTERNAL_SHARED_SECRET:?Set INTERNAL_SHARED_SECRET}"
      SPRING_DATA_MONGODB_URI: "${MONGODB_URI_COMMUNITY}"
      SERVICES_IDENTITY_BASE_URL: "http://identity-service:8082"
      SERVICES_NOTIFICATIONS_BASE_URL: "http://notifications-service:8085"

  review-service:
    <<: *service-security
    build:
      context: .
      dockerfile: review-service/Dockerfile
    container_name: review_service
    expose:
      - "8089"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      JWT_SECRET: "${JWT_SECRET:?Set JWT_SECRET}"
      INTERNAL_SHARED_SECRET: "${INTERNAL_SHARED_SECRET:?Set INTERNAL_SHARED_SECRET}"
      SPRING_DATA_MONGODB_URI: "${MONGODB_URI_REVIEW}"
      CLIENTS_ORDERRESERVATIONBASEURL: "http://order-reservation-service:8086"

  # --- NEW FOLLOW SERVICE ---
  follow-service:
    <<: *service-security
    build:
      context: .
      dockerfile: follow-service/Dockerfile
    container_name: follow-service
    expose:
      - "8091"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      JWT_SECRET: "${JWT_SECRET:?Set JWT_SECRET}"
      INTERNAL_SHARED_SECRET: "${INTERNAL_SHARED_SECRET:?Set INTERNAL_SHARED_SECRET}"
      SPRING_DATA_MONGODB_URI: "${MONGODB_URI_FOLLOW}"
      CLIENTS_PROFILE_SERVICE_URL: "http://profile-service:8081"
      NOTIFICATIONS_SERVICE_URL: "http://notifications-service:8085"
    depends_on:
      - profile-service

  api-gateway:
    <<: *service-security
    build:
      context: .
      dockerfile: api-gateway/Dockerfile
    ports:
      - "127.0.0.1:9000:9000"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      JWT_SECRET: "${JWT_SECRET:?Set JWT_SECRET}"
      INTERNAL_SHARED_SECRET: "${INTERNAL_SHARED_SECRET:?Set INTERNAL_SHARED_SECRET}"
      CORS_ALLOWED_ORIGIN_PATTERNS: "${CORS_ALLOWED_ORIGIN_PATTERNS:-https://www.locallyl.com,https://locallyl.com}"
    depends_on:
      - identity-service
      - profile-service
      - listing-service
      - verification-service
      - order-reservation-service
      - notifications-service
      - community-service
      - review-service
      - follow-service
      - stripe-payment-service

  admin-service:
    <<: *service-security
    build:
      context: .
      dockerfile: admin-service/Dockerfile
    container_name: admin_service
    expose:
      - "8087"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      JWT_SECRET: "${JWT_SECRET:?Set JWT_SECRET}"
      INTERNAL_SHARED_SECRET: "${INTERNAL_SHARED_SECRET:?Set INTERNAL_SHARED_SECRET}"
      SPRING_DATA_MONGODB_URI: "${MONGODB_URI_ADMIN}"
      SECURITY_JWT_SECRET: "${JWT_SECRET}"
      CLIENTS_IDENTITYBASEURL: "http://identity-service:8082"
      CLIENTS_PROFILEBASEURL: "http://profile-service:8081"
      CLIENTS_LISTINGBASEURL: "http://listing-service:8084"
      CLIENTS_NOTIFICATIONSBASEURL: "http://notifications-service:8085"
      CLIENTS_ORDERRESERVATIONBASEURL: "http://order-reservation-service:8086"
      CLIENTS_VERIFICATIONBASEURL: "http://verification-service:8083"
    depends_on:
      - identity-service
      - profile-service
      - listing-service
      - notifications-service
      - order-reservation-service
      - verification-service
      - review-service
      - community-service

  stripe-payment-service:
    <<: *service-security
    build:
      context: .
      dockerfile: stripe-payment-service/Dockerfile
    container_name: stripe_payment_service
    expose:
      - "8090"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      JWT_SECRET: "${JWT_SECRET:?Set JWT_SECRET}"
      INTERNAL_SHARED_SECRET: "${INTERNAL_SHARED_SECRET:?Set INTERNAL_SHARED_SECRET}"
      STRIPE_SECRET_KEY: "${STRIPE_SECRET_KEY}"
      STRIPE_PUBLISHABLE_KEY: "${STRIPE_PUBLISHABLE_KEY}"
      STRIPE_WEBHOOK_SECRET: "${STRIPE_WEBHOOK_SECRET}"
      STRIPE_RETURN_URL: "${STRIPE_RETURN_URL}"
      STRIPE_REFRESH_URL: "${STRIPE_REFRESH_URL}"
      FRONTEND_PROFILE_URL: "${FRONTEND_PROFILE_URL}"
      PUBLIC_PLATFORM_BASE_URL: "${PUBLIC_PLATFORM_BASE_URL}"
      PROFILE_SERVICE_BASE_URL: "http://profile-service:8081"
      ORDER_SERVICE_BASE_URL: "http://order-reservation-service:8086"
      CLIENTS_PROFILEBASEURL: "http://profile-service:8081"
      CLIENTS_ORDERBASEURL: "http://order-reservation-service:8086"
      SPRING_DATA_MONGODB_URI: "${MONGODB_URI_PAYMENT}"
    depends_on:
      - profile-service
      - order-reservation-service

volumes:
  mongo_data:
