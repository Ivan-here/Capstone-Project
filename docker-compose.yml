services:
  # 1. The Database
  mongodb:
    image: mongo:latest
    container_name: mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  # 2. Service A: Verification
  verification-service:
    build: ./verification-service  # Path to the folder containing Dockerfile
    container_name: verification_service
    ports:
      - "8083:8083"
    environment:
      - SPRING_PROFILES_ACTIVE=docker # Activates application-docker.properties
    depends_on:
      - mongodb

  # 3. Service B: Listings
  listing-service:
    build: ./listing-service      # Path to the folder containing Dockerfile
    container_name: listing_service
    ports:
      - "8084:8084"
    environment:
      - SPRING_PROFILES_ACTIVE=docker # Activates application-docker.properties
    depends_on:
      - mongodb

  identity-service:
    build:
      context: .
      dockerfile: identity-service/Dockerfile
    ports:
      - "8082:8082"
    environment:
      MONGODB_URI: "${MONGODB_URI_IDENTITY}"
      JWT_SECRET: "${JWT_SECRET}"
      INTERNAL_SHARED_SECRET: "${INTERNAL_SHARED_SECRET}"

  profile-service:
    build:
      context: .
      dockerfile: profile-service/Dockerfile
    ports:
      - "8085:8085"
    environment:
      MONGODB_URI: "${MONGODB_URI_PROFILE}"
      JWT_SECRET: "${JWT_SECRET}"
      INTERNAL_SHARED_SECRET: "${INTERNAL_SHARED_SECRET}"
      CLIENTS_IDENTITYBASEURL: "http://identity-service:8082"
    depends_on:
      - identity-service

volumes:
  mongo_data: