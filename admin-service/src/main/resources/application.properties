server.port=8087
spring.application.name=admin-service

spring.data.mongodb.uri=${MONGODB_URI_ADMIN}
security.jwt.secret=${JWT_SECRET}

clients.identityBaseUrl=${IDENTITY_SERVICE_URL:http://localhost:8082}
clients.listingBaseUrl=${LISTING_SERVICE_URL:http://localhost:8084}
clients.notificationsBaseUrl=${NOTIFICATIONS_SERVICE_URL:http://localhost:8085}
clients.communityBaseUrl=${COMMUNITY_SERVICE_URL:http://localhost:8088}
clients.orderReservationBaseUrl=${ORDER_RESERVATION_SERVICE_URL:http://localhost:8086}
clients.profileBaseUrl=${PROFILE_SERVICE_URL:http://localhost:8081}
clients.verificationBaseUrl=${VERIFICATION_SERVICE_URL:http://localhost:8083}

internal.sharedSecret=${INTERNAL_SHARED_SECRET}
spring.cloud.openfeign.okhttp.enabled=true

# Fail closed: deployment must provide independent authentication secrets.
security.identity-url=${IDENTITY_SERVICE_URL:http://localhost:8082}
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.http-only=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=25MB
